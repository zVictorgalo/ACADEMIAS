name: Tests and Docker
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-never-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pulso:test .
      - name: Smoke test container and persistence volume
        shell: bash
        run: |
          docker run -d --name pulso -p 8000:8000 -e SECRET_KEY=ci-only-container-secret -v pulso-data:/app/data pulso:test
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:8000/health/; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/health/
          docker exec pulso python manage.py shell -c "from django.contrib.auth.models import User; User.objects.create_user('persistence-test')"
          docker rm -f pulso
          docker run -d --name pulso -p 8000:8000 -e SECRET_KEY=ci-only-container-secret -v pulso-data:/app/data pulso:test
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:8000/health/; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/health/
          docker exec pulso python manage.py shell -c "from django.contrib.auth.models import User; assert User.objects.filter(username='persistence-test').exists()"
      - if: always()
        run: docker logs pulso
